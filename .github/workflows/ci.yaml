name: Checks
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check tests scripts/*.py
      - run: ruff format --check tests scripts/*.py
      - run: pytest -q
      - run: node --check web/app.js
      - run: docker compose config --quiet
      - run: docker compose build
      - run: python scripts/converter-qa.py
      - run: docker build --target printer-qa -t paperboy-printer:qa .
      - run: python scripts/runtime-qa.py
      - run: docker compose up -d --wait
      - run: curl --fail http://localhost:8025/api/health
      - run: docker compose down
        if: always()
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cargo build --locked --bin paperboy
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start design preview
        run: |
          PAPERBOY_DEMO=1 PAPERBOY_DATA_DIR=/tmp/paperboy-preview PAPERBOY_HOST=127.0.0.1 PAPERBOY_PORT=8026 nohup target/debug/paperboy > /tmp/paperboy-preview.log 2>&1 &
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8026/api/health; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - run: npm run test:browser
