[project]
name = "paperboy"
version = "0.2.0"
description = "Paperboy migration reference and Docker verification tools"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["tests/legacy", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["paperboy", "tests"]
